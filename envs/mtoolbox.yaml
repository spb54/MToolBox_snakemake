channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - samtools=1.11
  - numpy=1.19.2
  - picard=2.23.7
  - bcftools=1.11
  - trimmomatic=0.39
  - biopython=1.78
  - pip=20.2.3
  - seqtk=1.3
  - snakemake=5.26
  - pyvcf=0.6.7
  - gmap=2020.04.08
  - yaml=0.2.5
  - python=3.6
  - scipy=1.5.2
  - bamutil=1.0.14
  - fastqc=0.11.9
  - gatk-framework=3.6
  - pandas=1.1.3
  # MUSCLE 5 cannot align whole mitogenomes (>4Gb memory object), keep 3.8
  - muscle=3.8.1551
  - click
  - sqlalchemy
  # requests>=2.28 needs python>=3.7, which breaks the pip install of mtoolnote
  - requests<2.28
  # mtoolnote dependencies with C extensions: from conda, so pip does not
  # have to compile them
  - pysam
  - scikit-allel
  - pip:
    - mtoolnote==0.2.0
    # mtoolnote 0.2.0 uses vcfpy.OrderedDict, removed in vcfpy 0.14
    - vcfpy<0.14
